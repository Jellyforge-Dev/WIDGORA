name: build

on:
  push:
    branches: [main]
  pull_request:

# Only the newest run per branch matters. Superseded runs are cancelled so that
# the free Actions allowance is not spent on results nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6.4.1

      - name: Set up JDK
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Assemble, test and lint
        run: ./gradlew assembleDebug test lint
