# WIDGORA dependency versions.
#
# Only stable releases are listed here. No alpha, beta or release-candidate versions.
# Every entry was taken from the publishing repository's own metadata, not from memory.

[versions]
# Build tooling
agp = "9.5.1"
# Android Gradle plugin 9.5.1 resolves kotlin-gradle-plugin 2.2.10 itself and brings
# built-in Kotlin support. Pinning the same version keeps exactly one Kotlin on the
# shared buildscript classpath instead of silently upgrading the one AGP was tested with.
kotlin = "2.2.10"

# SDK levels
# compileSdk: highest installed stable platform. Android Gradle plugin 9.5 documents
# API level 37 as the maximum API level it supports.
compileSdk = "37"
# minSdk / targetSdk match the reach documented in ARCHITECTURE.md, which is the reach
# of the host launcher WIDGORA is meant to sit next to. These are product decisions and
# are not changed to follow whatever platform happens to be installed.
minSdk = "28"
targetSdk = "36"

# JVM
# The toolchain that compiles the project. The bytecode target is kept lower on purpose,
# see jvmTarget below.
jdkToolchain = "21"
jvmTarget = "17"

# AndroidX
activityCompose = "1.13.0"
composeBom = "2026.09.00"
tvMaterial = "1.1.0"

# Persistence and concurrency
# DataStore: latest stable on the AndroidX release page, "Stable Release 1.3.0", dated
# October 21, 2026, released as androidx.datastore:datastore-*:1.3.0.
datastore = "1.3.0"
# Coroutines: latest stable according to the publishing repository's metadata, where <latest>
# and <release> both name this version. Used directly by :core, so it is declared rather than
# taken from whatever DataStore happens to pull in.
coroutines = "1.11.0"

# Background work. Taken from the publishing repository's own metadata for
# androidx.work:work-runtime, where <latest> and <release> both name this version.
# Only this one artefact. The -ktx variant is not used: the coroutine worker and the
# request builders it once added now live in the main artefact, so taking it would be a
# second coordinate for the same code.
work = "2.12.0"

# Instrumented tests only. Versions as listed on the AndroidX test release page: the JUnit
# extension and the runner are on separate release lines and do not share a number.
androidxTestJunit = "1.3.0"
androidxTestRunner = "1.7.0"

# Networking
# Latest stable release according to the publishing repository's own metadata, where both
# <latest> and <release> name this version. The project states a minimum of Android 5.0
# (API level 21) and Java 8, which is below this project's own minimum of API 28.
okhttp = "5.5.1"

[libraries]
# Test only. The version follows the Kotlin version above, because kotlin-test ships with the
# compiler and must not drift away from it. The framework-specific artifact is named directly:
# the plain kotlin-test module relies on a variant rule that the Android unit test tasks do not
# apply, which leaves the test annotations unresolved.
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }

# Test only. The mock server of the same project, so that HTTP failure modes are exercised
# against a real socket instead of a stubbed client. The artifact id carries the 3 of the
# mockwebserver3 namespace that the 5.x line uses; its metadata lists this version as current.
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

# Key-value storage. The typed variant is not used: it would require a serialisation library,
# and an instance is a handful of scalar fields.
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }

# Instrumented tests only.
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
# Version comes from the Compose bill of materials above. Already in the tree through
# androidx.tv:tv-material; declared because the application uses it directly for text input,
# which tv-material does not provide.
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
# Debug builds only: it carries the preview renderer and would otherwise ship in a release.
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-tv-material = { module = "androidx.tv:tv-material", version.ref = "tvMaterial" }

# The periodic refresh behind the widgets. It brings manifest entries of its own, which are
# listed and accounted for in SECURITY.md rather than inherited unexamined.
androidx-work-runtime = { module = "androidx.work:work-runtime", version.ref = "work" }

# Instrumented tests only. Both take their version from the Compose bill of materials above, so
# they cannot drift away from the Compose the application is built against. The first carries the
# test rule and the key-event injection a remote control's keys are simulated with; the second
# carries nothing but the activity that rule hosts its content in, which is why it is a debug
# dependency and never reaches a release build.
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
